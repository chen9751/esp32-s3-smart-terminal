name: Single ESP-IDF Firmware Build
on:
  push:
    branches: [main]
    paths:
      - "apps/terminal/**"
      - "components/**"
      - "assets/remix/**"
      - "tools/generate_launcher_icons.py"
      - "partitions/single_app_16mb.csv"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate embedded Launcher icons
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 tools/generate_launcher_icons.py
      - name: Build single firmware (ESP-IDF 5.5.4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: apps/terminal
          command: idf.py build
      - name: Check 8MiB factory slot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          image=Path('apps/terminal/build/smart_terminal.bin')
          size=image.stat().st_size
          assert size <= 0x800000, f'Image {size} exceeds 8MiB slot'
          print(f'Image size: {size} / {0x800000} bytes')
          PY
      - name: Upload single firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-terminal-factory
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/terminal/build/smart_terminal.bin
            apps/terminal/build/bootloader/bootloader.bin
            apps/terminal/build/partition_table/partition-table.bin
            apps/terminal/build/flasher_args.json
