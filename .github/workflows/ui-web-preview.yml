name: UI Web Preview
on:
  push:
    branches: [main]
    paths:
      - "web_preview/**"
      - "components/launcher_ui/**"
      - "assets/remix/**"
      - "tools/generate_launcher_icons.py"
      - ".github/workflows/ui-web-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten (from old project)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.15"
          actions-cache-folder: emsdk-cache
      - name: Generate embedded Remix SVG icons
        run: |
          python -m pip install --quiet pillow cairosvg
          python tools/generate_launcher_icons.py
      - name: Configure LVGL 9.2.2 WebAssembly preview
        run: emcmake cmake -S web_preview -B web_preview/build -DCMAKE_BUILD_TYPE=Release
      - name: Build preview
        run: cmake --build web_preview/build -j2
      - name: Publish Pages artifact
        run: |
          mkdir -p web_preview/dist
          cp web_preview/build/index.html web_preview/build/index.js web_preview/build/index.wasm web_preview/dist/
          touch web_preview/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web_preview/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
